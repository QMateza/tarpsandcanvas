<div class="hidden"><p>.</p></div>
<section class="flex-hero-section">

      <h1>Our Products</h1>
      <p>
        From tarpaulin to Porta Tank solutions, we build strong, efficient,
        custom-made products tailored to your needs. These are only a few
        examples—if you can imagine it, we can make it.
      </p>
      <a href="" class="cta">Request a quote</a>

      <picture>

          type="image/webp"
        />
        <img src="{% static 'img/IMG05-about.jpg' %}" alt="" />

</section>
